name: iOS Unsigned

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45

    env:
      SENTRY_DISABLE_AUTO_UPLOAD: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check Expo
        run: |
          npx expo --version
          npm ls expo @expo/ui react-native expo-modules-core

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Xcode version
        run: xcodebuild -version

      - name: Build unsigned iOS archive
        run: |
          set -o pipefail
          mkdir -p build

          xcodebuild \
            -workspace ios/Twilite.xcworkspace \
            -scheme Twilite \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/Twilite.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild.log

      - name: Show Xcode errors
        if: failure()
        run: |
          echo "========== XCODE ERRORS =========="
          grep -n -E \
            "error:|fatal error:|BUILD FAILED|ARCHIVE FAILED|The following build commands failed" \
            build/xcodebuild.log || true

          echo ""
          echo "========== LAST 200 LINES =========="
          tail -n 200 build/xcodebuild.log

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Twilite-xcode-build-log
          path: build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify archive
        run: |
          test -d build/Twilite.xcarchive/Products/Applications/Twilite.app

      - name: Verify bundle identifier
        run: |
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            build/Twilite.xcarchive/Products/Applications/Twilite.app/Info.plist

      - name: Create unsigned IPA
        run: |
          set -euo pipefail

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R \
            build/Twilite.xcarchive/Products/Applications/Twilite.app \
            build/Payload/Twilite.app

          cd build
          zip -qry Twilite-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Twilite-iOS-unsigned
          path: build/Twilite-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: Twilite-iOS-xcarchive
          path: build/Twilite.xcarchive
          if-no-files-found: error
          retention-days: 3
