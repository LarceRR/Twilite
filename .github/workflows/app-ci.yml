name: App CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Mobile app
    runs-on: ubuntu-latest

    env:
      SENTRY_DISABLE_AUTO_UPLOAD: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build Android bundle
        run: npx expo export --platform android --output-dir .expo/ci-android

      - name: Build iOS bundle
        run: npx expo export --platform ios --output-dir .expo/ci-ios
