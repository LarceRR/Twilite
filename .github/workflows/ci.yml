name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Android app CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: production
      SENTRY_DISABLE_AUTO_UPLOAD: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Verify production Expo config
        run: |
          node - <<'NODE'
          const { execSync } = require('node:child_process');

          const output = execSync('npx expo config --type public --json', {
            encoding: 'utf8',
            env: process.env,
          });

          const config = JSON.parse(output);

          if (config.extra?.mode !== 'production') {
            throw new Error(
              `Expected extra.mode=production, got ${JSON.stringify(config.extra?.mode)}`,
            );
          }

          if (config.extra?.apiBaseUrl !== 'https://api.twilite.ru/v1') {
            throw new Error(
              `Unexpected API base URL: ${JSON.stringify(config.extra?.apiBaseUrl)}`,
            );
          }

          console.log('Production Expo config verified');
          console.log(`mode=${config.extra.mode}`);
          console.log(`apiBaseUrl=${config.extra.apiBaseUrl}`);
          NODE

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir .expo/ci-android

      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: Twilite-android-bundle
          path: .expo/ci-android
          if-no-files-found: error
          retention-days: 7
